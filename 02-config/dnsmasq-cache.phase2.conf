# Caching DNS forwarder in front of the client (Extension B)
interface=eth0
listen-address=172.30.0.16

# Do not read /etc/resolv.conf; forward to our authoritative dnsmasq servers
no-resolv
server=172.30.0.10
server=172.30.0.15

# Enable DNS cache
cache-size=1000

# Log DNS queries and cache hits
log-queries
log-facility=-
